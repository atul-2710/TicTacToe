<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Tic Tac Toe Game</title>
  </head>
  <body>
    <div class="welcome-screen fullscreen-flex">
      <h1>Tic Tac Toe</h1>
      <div class="game-mode">
        <p id="choose-mode">Choose Game Mode</p>
        <div>
          <button id="mode1" class="btn">Player VS Player</button>
          <button id="mode2" class="btn">Player VS System</button>
        </div>
      </div>
    </div>

    <div class="msg-container fullscreen-flex hide">
      <p id="msg">Winner</p>
      <div>
        <button id="new-btn" class="btn">New Game</button>
        <button id="continue-btn" class="btn">Continue Game</button>
      </div>

      <div class="score-board">
        <p>Score Board</p>
        <div class="score">
          <p id="overall-winner">Overall Game Winner : Looks like Game Ended Early!</p>
          <p id="games">Games Played :</p>
          <p id="x-wins">Games won by Player X :</p>
          <p id="o-wins">Games won by Player O :</p>
        </div>
      </div>
    </div>

    <main class="main-game hide">
      <h1>Tic Tac Toe</h1>
      <div class="container">
        <div class="game">
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
        </div>
      </div>
      <div>
        <button id="reset-btn" class="btn">Reset Board</button>
        <button id="end-btn" class="btn">End this Game</button>
      </div>
      <script src="./app.js"></script>
    </main>
  </body>
</html>
